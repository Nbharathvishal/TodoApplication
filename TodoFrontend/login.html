<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>TaskVerse — Sign In</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        (function() {
            try {
                var email = localStorage.getItem("userEmail");
                var theme = null;
                if (email) {
                    var raw = localStorage.getItem("taskverse_prefs_" + email);
                    if (raw) {
                        var prefs = JSON.parse(raw);
                        if (prefs && prefs.theme) theme = prefs.theme;
                    }
                }
                if (!theme) {
                    var globalTheme = localStorage.getItem("taskverse_theme");
                    if (globalTheme) theme = globalTheme;
                }
                document.documentElement.setAttribute("data-theme", theme || "light");
            } catch (e) {
                document.documentElement.setAttribute("data-theme", "light");
            }
        })();
    </script>
</head>
<body class="auth-body">
    <div class="auth-wrapper">
        <div class="auth-brand">
            <div class="brand-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
            </div>
            <h1 class="brand-title">Task<span>Verse</span></h1>
        </div>

        <h2 class="auth-heading">Welcome Back</h2>
        <p class="auth-subtitle">Enter your credentials to enter your command center.</p>

        <form id="login-form" class="auth-form" onsubmit="event.preventDefault(); login();">
            <div class="form-field">
                <label for="email" class="form-label">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    class="input-control" 
                    placeholder="you@domain.com" 
                    required 
                    autocomplete="email" 
                />
            </div>
            <div class="form-field">
                <label for="password" class="form-label">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    class="input-control" 
                    placeholder="••••••••" 
                    required 
                    autocomplete="current-password" 
                />
            </div>
            <button type="submit" id="login-btn" class="btn-primary">
                Sign In
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="register.html">Create one</a>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container"></div>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
