<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Todos</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container">
        <div class="header-bar">
            <span id="user-email" class="user-info">Logged in</span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
        <h2>Your Todos</h2>

        <div id="todo-list" class="todo-cards">
            <p id="empty-message">Loading your todos...</p>
        </div>

        <form class="add-todo" onsubmit="event.preventDefault(); addTodo();">
            <input type="text" id="new-todo" placeholder="Add new todo" required />
            <button type="submit">Add</button>
        </form>
    </div>

    <script src="script.js"></script>

</body>

</html>
