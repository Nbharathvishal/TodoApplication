<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>TaskVerse — Create Account</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
    <div class="auth-wrapper">
        <div class="auth-brand">
            <div class="brand-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
            </div>
            <h1 class="brand-title">Task<span>Verse</span></h1>
        </div>

        <h2 class="auth-heading">Join the Mission</h2>
        <p class="auth-subtitle">Sign up to supercharge your daily execution.</p>

        <form id="register-form" class="auth-form" onsubmit="event.preventDefault(); register();">
            <div class="form-field">
                <label for="email" class="form-label">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    class="input-control" 
                    placeholder="you@domain.com" 
                    required 
                    autocomplete="email" 
                />
            </div>
            <div class="form-field">
                <label for="password" class="form-label">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    class="input-control" 
                    placeholder="••••••••" 
                    required 
                    autocomplete="new-password" 
                />
            </div>
            <button type="submit" id="register-btn" class="btn-primary">
                Register Account
            </button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="login.html">Sign in here</a>
        </div>

        <div class="server-selector-card">
            <div class="server-label-row">
                <span>Backend Target</span>
                <span style="font-size: 0.6875rem; color: #4ade80;">Active</span>
            </div>
            <div class="server-options">
                <button type="button" class="btn-server-opt active" id="btn-server-cloud" onclick="switchBackend('cloud')">
                    Cloud (Render)
                </button>
                <button type="button" class="btn-server-opt" id="btn-server-local" onclick="switchBackend('local')">
                    Local (8080)
                </button>
            </div>
            <div id="server-url-display" class="server-url-caption">Target API: Loading...</div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
